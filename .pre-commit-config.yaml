repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --project backend --locked ruff check --force-exclude
        language: system
        files: ^backend/
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run --project backend --locked ruff format --check --force-exclude
        language: system
        files: ^backend/
        types: [python]
