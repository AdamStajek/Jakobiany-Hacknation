[project]
name = "hacknation-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.3",
    "fastapi",
    "httpx>=0.28.1",
    "numpy>=2.5.5",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "reportlab>=5.1.0",
    "shapely>=2.2.0",
    "uvicorn",
    "websockets>=15",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "pytest>=9.2.0",
    "ruff==0.17.6",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
pythonpath = ["."]
