[project]
name = "hacknation-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "fastapi",
    "jsonschema>=4.26.0",
    "openpyxl>=3.1.5",
    "pypdf>=7.1.1",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.3",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit==4.7.0",
    "ruff==0.17.6",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "N"]
