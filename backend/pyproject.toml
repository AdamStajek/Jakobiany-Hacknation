[project]
name = "hacknation-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
]

[dependency-groups]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.6",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "N"]
