name: wodostraznik
services:
  wodo:
    build: .
    ports:
      - "127.0.0.1:${WODO_PORT:-8080}:8000"
    environment:
      - CDSE_CLIENT_ID
      - CDSE_CLIENT_SECRET
      - CDSAPI_KEY
      - WODO_PASSPORT_LAYERS
      - WODO_NONCOMMERCIAL_OPEN_METEO
      - WODO_EGIB_GPKG=/egib/ostrowiecki-2607.gpkg
    init: true
    restart: unless-stopped
    volumes:
      - wodo-cache:/var/lib/wodo
      - ./.wodo-cache/egib:/egib:ro
volumes:
  wodo-cache:
