<section aria-labelledby="wynik" class="space-y-4">
  <header class="relative flex items-center justify-between gap-2">
    <div class="min-w-0">
      <h2 id="wynik" tabindex="-1" class="text-lg font-bold tracking-tight lg:text-2xl">Stan wody na Twojej działce</h2>
      <p class="text-sm text-muted-color">Działka {{report().parcel.id}} · <time [attr.datetime]="report().date">{{day()}}</time></p>
    </div>
    <details class="shrink-0 text-sm print:hidden">
      <summary aria-label="Zapis i wydruk" title="Zapis i wydruk" class="flex min-h-11 cursor-pointer list-none items-center gap-2 rounded-lg border border-surface bg-surface-0 px-3 font-medium dark:bg-surface-800">
        <i class="pi pi-file-export text-primary" aria-hidden="true"></i><span class="hidden lg:inline">Zapis i wydruk <i class="pi pi-angle-down" aria-hidden="true"></i></span>
      </summary>
      <div class="pw-card absolute right-0 z-20 mt-1 flex w-max max-w-[85vw] flex-wrap gap-2 p-2 shadow-lg">
        <a pButton [href]="'/api/analysis/' + report().analysis_id + '/report'" download>PDF</a>
        <a pButton [href]="'/api/analysis/' + report().analysis_id + '/report?format=json'" download severity="secondary">JSON</a>
        <p-button icon="pi pi-print" ariaLabel="Drukuj" severity="secondary" (onClick)="print()" />
        <p-button icon="pi pi-link" ariaLabel="Kopiuj link" severity="secondary" (onClick)="copyLink()" />
        <a pButton [routerLink]="['/dzialka', report().parcel.id, 'paszport']" severity="secondary">Dane działki</a>
      </div>
    </details>
  </header>

  <nav aria-label="Kroki raportu" class="print:hidden">
    <ol class="grid grid-cols-3 border-b border-surface">
      @for (label of steps; track label; let n = $index) {
        <li>
          <button #stepButton type="button" class="flex min-h-12 w-full items-center justify-center gap-1 border-b-2 px-1 text-sm leading-tight"
            [class]="step() === n + 1 ? 'border-primary font-bold text-primary' : 'border-transparent text-muted-color'"
            [attr.aria-current]="step() === n + 1 ? 'step' : null" [attr.aria-controls]="'krok-' + (n + 1)" (click)="step.set(n + 1)">
            <span class="shrink-0">{{n + 1}}.</span> <span>{{label}}</span>
          </button>
        </li>
      }
    </ol>
  </nav>

  <div id="krok-1" [class.hidden]="step() !== 1" class="print:block">
    <app-report-analysis [report]="report()" (experimentsRequested)="openExperiments()" />
  </div>
  <div id="krok-2" [class.hidden]="step() !== 2" class="print:block"><app-report-experiments [report]="report()" /></div>
  <div id="krok-3" [class.hidden]="step() !== 3" class="print:block">
    <app-report-recommendations [items]="report().recommendations" [geometry]="report().parcel.geometry" />
  </div>
</section>
