<p-toast />
<main class="mx-auto max-w-3xl p-6 flex flex-col gap-6">
  <header class="flex items-center justify-between">
    <h1>eloelo</h1>
    <div class="flex flex-col gap-1">
      <h1 class="text-2xl font-extrabold tracking-wide m-0">
        <span class="text-brand-navy">PROJEKT</span> <span class="text-primary">KOMPAS</span>
      </h1>
      <div class="brand-bar mt-1"></div>
    </div>
    <p-button
      [icon]="dark() ? 'pi pi-sun' : 'pi pi-moon'"
      [rounded]="true"
      [text]="true"
      severity="secondary"
      (onClick)="toggleDark()"
      aria-label="Przełącz motyw"
    />
  </header>

  <p-card header="Status API">
    <p-tag [value]="apiMessage()" [severity]="apiOk() === null ? 'info' : apiOk() ? 'success' : 'danger'" />
  </p-card>

  <p-card header="Dodaj osobę">
    <div class="flex flex-wrap gap-3 items-center">
      <input pInputText [(ngModel)]="name" placeholder="Imię" class="grow" />
      <p-select [options]="roles" [(ngModel)]="role" placeholder="Rola" class="w-48" />
      <p-button label="Dodaj" icon="pi pi-plus" (onClick)="add()" />
    </div>
  </p-card>

  <p-card header="Zespół">
    <p-table [value]="rows()" stripedRows>
      <ng-template #header>
        <tr><th>#</th><th>Imię</th><th>Rola</th><th>Status</th></tr>
      </ng-template>
      <ng-template #body let-row>
        <tr>
          <td>{{ row.id }}</td>
          <td>{{ row.name }}</td>
          <td>{{ row.role }}</td>
          <td><p-tag [value]="row.status" [severity]="severity(row.status)" /></td>
        </tr>
      </ng-template>
    </p-table>
  </p-card>
</main>
